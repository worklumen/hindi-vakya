<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f5fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0e1c" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Learn Hindi by building sentences, one word at a time." />
  <title>Hindi Vakya</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%233b4cd8'/%3E%3Ctext x='32' y='34' font-family='Tiro Devanagari Hindi, serif' font-size='30' font-weight='700' fill='%23ffffff' text-anchor='middle' dominant-baseline='central'%3E%E0%A4%B5%E0%A4%BE%3C/text%3E%3C/svg%3E"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap"
  />
  <link rel="stylesheet" href="assets/base.css?v=45" />
  <link rel="stylesheet" href="assets/hub.css?v=45" />
  <link rel="stylesheet" href="assets/arena.css?v=45" />
</head>
<body>
  <!-- Icon sprite: referenced via <use href="#i-…"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.6v14.8a1 1 0 0 0 1.5.86l12-7.4a1 1 0 0 0 0-1.72l-12-7.4A1 1 0 0 0 7 4.6z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
      <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></symbol>
      <symbol id="i-flame" viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></symbol>
      <symbol id="i-listen" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5zM15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/></symbol>
      <symbol id="i-clear" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="i-words" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5v-14A2.5 2.5 0 0 1 6.5 3H20v14H6.5A2.5 2.5 0 0 0 4 19.5z"/></symbol>
      <symbol id="i-arcade" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3"/><circle cx="7" cy="12" r="1.5"/><path d="M14 10h4M16 8v4M6 10v4M4 12h4"/></symbol>
      <!-- Dedicated Game Icons -->
      <!-- Word Bridge: Arch bridge connecting two sides with road/pillars -->
      <symbol id="i-game-bridge" viewBox="0 0 24 24">
        <path d="M3 17h18" stroke-width="2.2"/>
        <path d="M3 13c3-5 15-5 18 0" stroke-width="2"/>
        <path d="M7 13.5V17M12 12V17M17 13.5V17" stroke-width="1.8"/>
        <circle cx="3" cy="17" r="1.2" fill="currentColor"/>
        <circle cx="21" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
      <!-- Word Anchor: Anchor with ring, stock, shank, and curved flukes -->
      <symbol id="i-game-anchor" viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="2.2" stroke-width="2"/>
        <path d="M12 7.2V20" stroke-width="2.2"/>
        <path d="M8 10.5h8" stroke-width="2"/>
        <path d="M4.5 14.5c1.2 4.5 5 6.5 7.5 6.5s6.3-2 7.5-6.5" stroke-width="2.2"/>
        <path d="M4 13l1 2M20 13l-1 2" stroke-width="2"/>
      </symbol>
      <!-- Word Detective: Magnifying glass inspecting text/tile -->
      <symbol id="i-game-detective" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6" stroke-width="2"/>
        <path d="M15 15l5.5 5.5" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M8.5 10.5h4M10.5 8.5v4" stroke-width="1.8"/>
      </symbol>
      <!-- Word Swap: Two horizontal curved arrows in loop -->
      <symbol id="i-game-swap" viewBox="0 0 24 24">
        <path d="M4 8h12M13 5l3 3-3 3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 16H8M11 13l-3 3 3 3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <!-- Word Doctor: Medical cross on notepad / stethoscope badge -->
      <symbol id="i-game-doctor" viewBox="0 0 24 24">
        <rect x="4" y="3" width="16" height="18" rx="3.5" stroke-width="1.8"/>
        <path d="M12 7.5v9M7.5 12h9" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
      <!-- Word Link: Interlinked chain rings -->
      <symbol id="i-game-link" viewBox="0 0 24 24">
        <path d="M9 15l6-6" stroke-width="2.2"/>
        <path d="M10 8.5L7.5 6A3.5 3.5 0 0 0 2.5 11l2.5 2.5" stroke-width="2.2"/>
        <path d="M14 15.5l2.5 2.5a3.5 3.5 0 0 0 5-5L19 10.5" stroke-width="2.2"/>
      </symbol>
      <!-- Word Flash: Lightning card / flash badge -->
      <symbol id="i-game-flash" viewBox="0 0 24 24">
        <rect x="4" y="3" width="16" height="18" rx="3.5" stroke-width="1.8"/>
        <path d="M13 6.5 8.5 13h5L11 18.5 16 11.5h-5z" stroke-width="1.8" stroke-linejoin="round" fill="currentColor" fill-opacity="0.18"/>
      </symbol>
      <!-- Word Vanish: Eye dissolving / dashes / disappearing rays -->
      <symbol id="i-game-vanish" viewBox="0 0 24 24">
        <path d="M2.5 12c2.5-4.5 6-7 9.5-7s7 2.5 9.5 7c-1.5 2.8-3.5 4.8-6 6" stroke-width="2"/>
        <path d="M3 20l4.5-4.5" stroke-width="2"/>
        <circle cx="12" cy="12" r="3" stroke-width="2"/>
        <path d="M18 19h4M19 16l3 1M19 22l3-1" stroke-width="1.8"/>
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <!-- App bar -->
    <header id="app-bar" class="app-bar">
      <h1 class="wordmark" lang="hi">हिंदी वाक्य</h1>
    </header>

    <main id="main" class="main">
      <!-- Games / Home (16 Interactive Drills & Games Hub + Arena) -->
      <section id="section-home" class="section active" aria-label="Games">
        <!-- Hub Grid View -->
        <div id="section-arcade-hub" class="arcade-hub-view">
          <div id="arcade-games-grid" class="arcade-games-grid"></div>
        </div>

        <!-- Single Game Play Arena View -->
        <div id="section-arcade-arena" class="arcade-arena-view" hidden>
          <div class="arcade-arena-top">
            <button id="btn-arcade-exit" class="icon-btn" type="button" aria-label="Exit Game">
              <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
            <h3 id="arcade-arena-title" class="arcade-arena-title">Game Title</h3>
            <div class="arcade-hud">
              <button id="btn-arcade-next" class="icon-btn arcade-next-btn" type="button" aria-label="Next round" title="Next">&#x23ED;</button>
            </div>
          </div>

          <div class="arcade-timer-track" hidden>
            <div id="arcade-timer-bar" class="arcade-timer-fill"></div>
          </div>

          <div id="arcade-arena-board" class="arcade-arena-board"></div>
        </div>
      </section>

      <!-- Sentence Builder Game (full-screen, bottom nav hidden) -->
      <section id="section-game" class="section" aria-label="Sentence Builder">
        <div class="game-head">
          <button id="btn-exit" class="icon-btn" type="button" aria-label="Exit">
            <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
          </button>
          <div class="game-meta">
            <span id="game-count" class="game-count" aria-live="polite"></span>
          </div>
        </div>

        <p id="en-sentence" class="prompt"></p>

        <div id="answer-row" class="tile-row answer-row" role="group" aria-label="Your sentence"></div>
        <div id="place-track" class="track" role="progressbar" aria-label="Words placed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="place-progress" class="track-fill"></div>
        </div>

        <div id="tile-bank" class="tile-row tile-bank" role="group" aria-label="Word bank" lang="hi"></div>

        <div class="game-actions">
          <div id="actions-play" class="actions-stack">
            <div class="tools">
              <button id="btn-clear" class="btn btn-secondary" type="button">
                <svg class="icon" aria-hidden="true"><use href="#i-clear"/></svg>Clear
              </button>
            </div>
            <button id="btn-check" class="btn btn-primary btn-lg" type="button" disabled>
              <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Check
            </button>
          </div>

          <div id="actions-done" class="actions-pair" hidden>
            <button id="btn-done" class="btn btn-secondary btn-lg" type="button">
              <svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>Finish
            </button>
            <button id="btn-next" class="btn btn-primary btn-lg" type="button">
              Next<svg class="icon" aria-hidden="true"><use href="#i-next"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- Stats Section -->
      <section id="section-stats" class="section" aria-label="Stats">
        <!-- Overview KPI Cards -->
        <div class="stats-kpi-grid">
          <div class="kpi-card kpi-card-merged">
            <div class="kpi-merged-values">
              <div class="kpi-stat-item">
                <span class="kpi-stat-label">Play</span>
                <strong id="kpi-sentences-seen" class="kpi-value">0</strong>
                <small id="kpi-sentences-sub" class="kpi-sub">of 0 total</small>
              </div>
              <div class="kpi-stat-divider" aria-hidden="true"></div>
              <div class="kpi-stat-item">
                <span class="kpi-stat-label">Done</span>
                <strong id="kpi-sentences-done" class="kpi-value">0</strong>
                <small id="kpi-sentences-rate" class="kpi-sub">0% completion</small>
              </div>
            </div>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Unique Words</span>
            <strong id="kpi-words-seen" class="kpi-value">0</strong>
            <small id="kpi-words-sub" class="kpi-sub">encountered</small>
          </div>
          <div class="kpi-card">
            <span class="kpi-label">Play Rating</span>
            <strong id="kpi-arcade-pts" class="kpi-value">0</strong>
            <small id="kpi-arcade-sub" class="kpi-sub">out of 10</small>
          </div>
        </div>

        <!-- Games Performance Summary -->
        <div class="card table-card">
          <div class="table-wrap">
            <table id="games-stats-table">
              <thead>
                <tr>
                  <th scope="col">Game</th>
                  <th scope="col" class="num">Play</th>
                  <th scope="col" class="num">Done</th>
                </tr>
              </thead>
              <tbody id="games-stats-tbody"></tbody>
            </table>
          </div>
        </div>

        <div style="margin-top: 1.5rem; text-align: center;">
          <button id="btn-reset" class="btn btn-danger" type="button">Reset All</button>
        </div>
      </section>
    </main>

    <!-- Bottom navigation -->
    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary">
      <button id="nav-home" class="nav-item active" type="button" aria-current="page">
        <svg class="icon" aria-hidden="true"><use href="#i-arcade"/></svg>
        <span class="nav-label">Games</span>
      </button>
      <button id="nav-stats" class="nav-item" type="button">
        <svg class="icon" aria-hidden="true"><use href="#i-words"/></svg>
        <span class="nav-label">Stats</span>
      </button>
    </nav>
  </div>

  <!-- Modal dialog (replaces alert / confirm) -->
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <form method="dialog" class="dialog-body">
      <h2 id="dialog-title" class="dialog-title"></h2>
      <p id="dialog-message" class="dialog-message"></p>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn btn-secondary" value="cancel" type="submit">Cancel</button>
        <button id="dialog-confirm" class="btn btn-primary" value="confirm" type="submit">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Arcade & Games Engine -->
  <script src="assets/engine.js?v=45"></script>
  <script src="assets/suite.js?v=45"></script>
  <script src="assets/hub.js?v=45"></script>

  <!-- Core App & Curriculum -->
  <script src="assets/app.js?v=45"></script>
</body>
</html>
