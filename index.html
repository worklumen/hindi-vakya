<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f5fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0e1c" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Learn Hindi by building sentences, one word at a time." />
  <title>Hindi Vakya</title>
  <link
    rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%233b4cd8'/%3E%3Ctext x='32' y='34' font-family='Tiro Devanagari Hindi, serif' font-size='30' font-weight='700' fill='%23ffffff' text-anchor='middle' dominant-baseline='central'%3E%E0%A4%B5%E0%A4%BE%3C/text%3E%3C/svg%3E"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Tiro+Devanagari+Hindi&display=swap"
  />
  <link rel="stylesheet" href="assets/base.css?v=67" />
  <link rel="stylesheet" href="assets/hub.css?v=67" />
  <link rel="stylesheet" href="assets/arena.css?v=67" />
</head>
<body>
  <!-- Icon sprite: referenced via <use href="#i-…"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="i-words" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5v-14A2.5 2.5 0 0 1 6.5 3H20v14H6.5A2.5 2.5 0 0 0 4 19.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-arcade" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="7" cy="12" r="1.5" fill="currentColor"/><path d="M14 10h4M16 8v4M6 10v4M4 12h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="i-hint" viewBox="0 0 24 24">
        <path d="M9 18h6M10 22h4" stroke-width="2" stroke-linecap="round"/>
        <path d="M12 2a7 7 0 0 0-7 7c0 2.6 1.4 4.8 3.5 6 .6.3 1 1 1 1.7V17h5v-.3c0-.7.4-1.4 1-1.7 2.1-1.2 3.5-3.4 3.5-6a7 7 0 0 0-7-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 6v3M10.5 7.5l3 0" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <!-- Game 1: Word Bridge -->
      <symbol id="i-game-bridge" viewBox="0 0 24 24">
        <path d="M3 17h18" stroke-width="2.2"/>
        <path d="M3 13c3-5 15-5 18 0" stroke-width="2"/>
        <path d="M7 13.5V17M12 12V17M17 13.5V17" stroke-width="1.8"/>
        <circle cx="3" cy="17" r="1.2" fill="currentColor"/>
        <circle cx="21" cy="17" r="1.2" fill="currentColor"/>
      </symbol>
      <!-- Game 2: Word Swap -->
      <symbol id="i-game-swap" viewBox="0 0 24 24">
        <path d="M4 8h12M13 5l3 3-3 3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M20 16H8M11 13l-3 3 3 3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <!-- Game 3: Word Doctor -->
      <symbol id="i-game-doctor" viewBox="0 0 24 24">
        <rect x="4" y="3" width="16" height="18" rx="3.5" stroke-width="1.8"/>
        <path d="M12 7.5v9M7.5 12h9" stroke-width="2.4" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <div class="app">
    <!-- App bar -->
    <header id="app-bar" class="app-bar">
      <h1 class="wordmark" lang="hi">हिंदी वाक्य</h1>
    </header>

    <main id="main" class="main">
      <!-- Games & Stats Main View -->
      <section id="section-home" class="section active" aria-label="Games & Stats">
        <!-- Hub Grid View (Stats + Games List + Reset) -->
        <div id="section-arcade-hub" class="arcade-hub-view">
          <!-- Stats Bar above Games -->
          <div class="stats-simple-stack">
            <div class="stat-simple-card">
              <span class="stat-simple-label">Unique Sentences</span>
              <div class="stat-simple-count">
                <strong id="stat-sentences-seen" class="stat-simple-val">0</strong>
                <span class="stat-simple-sep">/</span>
                <span id="stat-sentences-total" class="stat-simple-total">0</span>
              </div>
            </div>

            <div class="stat-simple-card">
              <span class="stat-simple-label">Unique Words</span>
              <div class="stat-simple-count">
                <strong id="stat-words-seen" class="stat-simple-val">0</strong>
                <span class="stat-simple-sep">/</span>
                <span id="stat-words-total" class="stat-simple-total">0</span>
              </div>
            </div>
          </div>

          <!-- List of Games -->
          <div id="arcade-games-grid" class="arcade-games-grid"></div>

          <!-- Reset Button at the bottom -->
          <div class="stat-simple-actions">
            <button id="btn-reset" class="btn btn-secondary" type="button">Reset</button>
          </div>
        </div>

        <!-- Single Game Play Arena View -->
        <div id="section-arcade-arena" class="arcade-arena-view" hidden>
          <div class="arcade-arena-top">
            <button id="btn-arcade-exit" class="icon-btn" type="button" aria-label="Exit Game">
              <svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>
            </button>
            <h3 id="arcade-arena-title" class="arcade-arena-title">Game Title</h3>
            <div class="arcade-hud">
              <button id="btn-arcade-dict" class="icon-btn arcade-dict-btn" type="button" aria-label="Toggle Hint / Word Meanings" title="Toggle Hint / Word Meanings" hidden>
                <svg class="icon" aria-hidden="true"><use href="#i-hint"/></svg>
              </button>
              <button id="btn-arcade-next" class="icon-btn arcade-next-btn" type="button" aria-label="Next round" title="Next">&#x23ED;</button>
            </div>
          </div>

          <div class="arcade-timer-track" hidden>
            <div id="arcade-timer-bar" class="arcade-timer-fill"></div>
          </div>

          <div id="arcade-arena-board" class="arcade-arena-board"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal dialog (replaces alert / confirm) -->
  <dialog id="dialog" class="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-message">
    <form method="dialog" class="dialog-body">
      <h2 id="dialog-title" class="dialog-title"></h2>
      <p id="dialog-message" class="dialog-message"></p>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn btn-secondary" value="cancel" type="submit">Cancel</button>
        <button id="dialog-confirm" class="btn btn-primary" value="confirm" type="submit">OK</button>
      </div>
    </form>
  </dialog>

  <!-- Arcade & Games Engine -->
  <script src="assets/engine.js?v=67"></script>
  <script src="assets/suite.js?v=67"></script>
  <script src="assets/hub.js?v=67"></script>

  <!-- Core App & Curriculum -->
  <script src="assets/app.js?v=67"></script>
</body>
</html>
